; Common section to define global or misc parameters
[common]  
redraw_mode         = auto
redraw_fps          = 25
redraw_min_pixels   = 20
draw_fps            = 1
predraw_screen      = 1


; Application section
[application]
auto_start          = 1
samples_cache_size  = 256
sampling_method     = "halton"
use_guiding_sampling = 1
horizontal_tiles    = 32
vertical_tiles      = 32
aging_factor        = 250


; Scene section to define parameters of scene
[scene]
use_scene_kdtree    = 0


; Raytracer settings
[raytracer]
tracer_msaa         = 1
use_tracer_msaa     = 0
tracer_depth        = 2
